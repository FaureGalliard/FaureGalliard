name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: fauregalliard
          template: classic
          base: header, activity, repositories
          isocalendar: yes
          languages: yes
          output_action: commit
          output_branch: output
          output_filename: github-metrics.svg
